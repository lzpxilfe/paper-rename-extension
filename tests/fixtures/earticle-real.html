<!doctype html><html><head><meta name="citation_title" content="사물인터넷 기기 보안평가를 위한 기술요소 기반의 모델 설계 및 체크리스트 적용"/><meta name="citation_author" content="한슬기"/><meta name="citation_author" content="김명주"/><meta name="citation_issn" content="1598-7329"/><meta name="citation_publication_date" content="2018/06"/><meta name="citation_journal_title" content="융합보안논문지"/><meta name="citation_volume" content="18"/><meta name="citation_issue" content="2"/><meta name="citation_firstpage" content="49"/><meta name="citation_lastpage" content="58"/><meta name="citation_keywords" content=" IoT device security; IoT device checklist; IoT security evaluation model"/><meta name="citation_abstract" content="사물인터넷의 수요가 증가하면서 사용자의 중요 정보들을 수집하는 사물인터넷 기기의 보안에 대한 필요성 또한 꾸준히 증가하고 있다. 하드웨어, 프로세서, 에너지 등의 제약이 있는 사물인터넷 특성상 기존의 보안시스템을 그대로 적용하기 어렵 기 때문에, 사물인터넷에 특화된 보안가이드라인 및 관련문서가 만들어지고 있다. 그러나 이들은 사물인터넷 기기 각각에 특 화된 보안을 구체적으로 다루기보다는 포괄적이며 일반화된 수준의 보안을 다루고 있다. 더구나 이들은 개발자 및 서비스 제 안자의 입장에서 작성되었기 때문에 특정 사물 인터넷 기기를 사용하고자 하는 일반 사용자의 입장에서 특정 사물인터넷 기 기가 어느 정도 보안성을 갖추고 있는지 파악하기가 어렵다. 본 논문에서는 사물인터넷과 관련된 기존 가이드라인과 문서들을 토대로 사물인터넷 기기 각각에 대하여 보다 구체화된 보안평가용 평가모델을 설계하여 제시하였다. 아울러 이 평가모델을 토 대로 대표적 사물인터넷 기기인 스마트워치를 대상으로 체크리스트를 적용하여 작성해 봄으로써 특정 사물인터넷 기기를 사 용하기 전에 보안성 평가를 일반 사용자도 용이하게 할 수 있음을 보여준다."/><meta name="citation_abstract_html_url" content="https://www.earticle.net/Article/A335000"/><meta property="og:type" content="article"/><meta property="og:title" content="사물인터넷 기기 보안평가를 위한 기술요소 기반의 모델 설계 및 체크리스트 적용"/><meta property="og:site_name" content="earticle"/><meta property="og:url" content="https://www.earticle.net/Article/A335000"/><meta property="og:description" content="사물인터넷의 수요가 증가하면서 사용자의 중요 정보들을 수집하는 사물인터넷 기기의 보안에 대한 필요성 또한 꾸준히 증가하고 있다. 하드웨어, 프로세서, 에너지 등의 제약이 있는 사물인터넷 특성상 기존의 보안시스템을 그대로 적용하기 어렵 기 때문에, 사물인터넷에 특화된 보안가이드라인 및 관련문서가 만들어지고 있다. 그러나 이들은 사물인터넷 기기 각각에 특 화된 보안을 구체적으로 다루기보다는 포괄적이며 일반화된 수준의 보안을 다루고 있다. 더구나 이들은 개발자 및 서비스 제 안자의 입장에서 작성되었기 때문에 특정 사물 인터넷 기기를 사용하고자 하는 일반 사용자의 입장에서 특정 사물인터넷 기 기가 어느 정도 보안성을 갖추고 있는지
