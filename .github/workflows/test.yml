name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 단위 테스트
        run: node tests/run-tests.js
      - name: manifest.json 형식 검사
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: 소스 구문 검사
        run: |
          for f in src/*.js popup/popup.js; do
            node --check "$f"
          done
